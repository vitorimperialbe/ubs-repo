# Perfil para rodar localmente SEM MySQL/Docker, com banco H2 em memória.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local  (com a variável LISTA_HOSTS=http://localhost:4200)
# Os dados somem quando o backend é desligado.
spring.datasource.url=jdbc:h2:mem:ubs;MODE=MySQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS ubs
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Chave só para desenvolvimento local (mínimo 32 caracteres)
security.jwt.secret-key=chave-local-de-desenvolvimento-ubs-123456
security.jwt.expiration-time=3600000

